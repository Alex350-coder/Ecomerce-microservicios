name: ecomerce-microservicios

# Red privada del proyecto: los servicios NO publican puertos al host
# (solo gateway, frontend y mysql publican).
# Nota: no se usa internal:true porque bloquea la publicación de puertos;
# el aislamiento se logra no publicando puertos de los servicios.
networks:
  internal:

volumes:
  mysql_data:

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD en .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD en .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD en .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD en .env}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?set CART_DB_PASSWORD en .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD en .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD en .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - internal

  gateway:
    build: ./core-services/gateway
    container_name: gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET en .env}
      AUTH_SERVICE_URL: http://auth-service:3002
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3003
      CART_SERVICE_URL: http://cart-service:3004
      ORDER_SERVICE_URL: http://order-service:3005
      INVENTORY_SERVICE_URL: http://inventory-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      REQUEST_TIMEOUT_MS: 15000
      BODY_LIMIT: 100kb
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  auth-service:
    build: ./core-services/auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD en .env}
      DB_DATABASE: auth_db
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET en .env}
      JWT_EXPIRES_IN: 1h
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  user-service:
    build: ./core-services/user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: user_user
      DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD en .env}
      DB_DATABASE: user_db
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET en .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  product-service:
    build: ./core-services/product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: product_user
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD en .env}
      DB_DATABASE: product_db
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET en .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  cart-service:
    build: ./core-services/cart-service
    container_name: cart-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: cart_user
      DB_PASSWORD: ${CART_DB_PASSWORD:?set CART_DB_PASSWORD en .env}
      DB_DATABASE: cart_db
      DB_SYNCHRONIZE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  order-service:
    build: ./core-services/order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD en .env}
      DB_DATABASE: order_db
      DB_SYNCHRONIZE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  inventory-service:
    build: ./core-services/inventory-service
    container_name: inventory-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD en .env}
      DB_DATABASE: inventory_db
      DB_SYNCHRONIZE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  payment-service:
    build: ./core-services/payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3007
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: payment_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD en .env}
      DB_DATABASE: payment_db
      DB_SYNCHRONIZE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - internal
