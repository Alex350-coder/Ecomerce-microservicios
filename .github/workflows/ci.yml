name: CI

on:
  push:
    branches: [master, main, feat/*]
  pull_request:

jobs:
  quality:
    name: quality (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: core-services/user-service
            strict: true
          - dir: core-services/product-service
            strict: true
          - dir: core-services/cart-service
            strict: true
          - dir: core-services/order-service
            strict: true
          - dir: core-services/inventory-service
            strict: true
          - dir: core-services/payment-service
            strict: true
          - dir: core-services/gateway
            strict: true
          - dir: core-services/auth-service
            strict: true
          - dir: frontend
            strict: true
            is-frontend: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Alinear npm con los lockfiles (generados con npm 11)
        run: npm install -g npm@11.2.0

      - name: Instalar dependencias
        working-directory: ${{ matrix.dir }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint
        continue-on-error: ${{ !matrix.strict }}

      - name: Typecheck
        working-directory: ${{ matrix.dir }}
        run: npm run typecheck --if-present

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Test with coverage (backend)
        if: ${{ !matrix.is-frontend }}
        working-directory: ${{ matrix.dir }}
        run: npm run test:cov -- --runInBand

      - name: Test with coverage (frontend)
        if: ${{ matrix.is-frontend }}
        working-directory: ${{ matrix.dir }}
        run: npm run test:coverage

      - name: Artifact name
        if: always()
        id: art
        shell: bash
        run: echo "name=coverage-$(echo '${{ matrix.dir }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: ${{ matrix.dir }}/coverage/
          retention-days: 7

  audit:
    name: audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - core-services/user-service
          - core-services/product-service
          - core-services/cart-service
          - core-services/order-service
          - core-services/inventory-service
          - core-services/payment-service
          - core-services/gateway
          - core-services/auth-service
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alinear npm con los lockfiles (generados con npm 11)
        run: npm install -g npm@11.2.0
      - name: npm audit (prod, bloqueante high/critical)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: smoke (docker compose + /health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar .env de desarrollo para el smoke test
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_smoke_root_only
          AUTH_DB_PASSWORD=ci_smoke_auth_only
          USER_DB_PASSWORD=ci_smoke_user_only
          PRODUCT_DB_PASSWORD=ci_smoke_product_only
          CART_DB_PASSWORD=ci_smoke_cart_only
          ORDER_DB_PASSWORD=ci_smoke_order_only
          INVENTORY_DB_PASSWORD=ci_smoke_inventory_only
          PAYMENT_DB_PASSWORD=ci_smoke_payment_only
          JWT_SECRET=ci_smoke_jwt_secret_only
          EOF

      - name: Levantar el stack completo
        run: docker compose up -d --build

      - name: Esperar a que los servicios estén healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose ps --status running 2>/dev/null | grep -q healthy; then
              COUNT=$(docker compose ps --status running | grep -c healthy || true)
              if [ "$COUNT" -ge 8 ]; then
                echo "healthy: $COUNT/8"
                break
              fi
            fi
            sleep 5
          done

      - name: Smoke test /health (gateway y frontend por host, servicios por exec)
        run: bash scripts/smoke-ci.sh

  security-tests:
    name: security-tests (auth-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core-services/auth-service/package-lock.json
      - name: Alinear npm con los lockfiles (generados con npm 11)
        run: npm install -g npm@11.2.0
      - name: Instalar dependencias
        working-directory: core-services/auth-service
        run: npm ci --no-audit --no-fund
      - name: Security suite (DTO validation, guards, error handling, validation pipe)
        working-directory: core-services/auth-service
        run: npm run test:security

  trivy:
    name: trivy (fs scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan (CRITICAL = fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          skip-dirs: node_modules,coverage,.git

  e2e:
    name: e2e (playwright critical flow)
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Generar .env para e2e
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_e2e_root_only
          AUTH_DB_PASSWORD=ci_e2e_auth_only
          USER_DB_PASSWORD=ci_e2e_user_only
          PRODUCT_DB_PASSWORD=ci_e2e_product_only
          CART_DB_PASSWORD=ci_e2e_cart_only
          ORDER_DB_PASSWORD=ci_e2e_order_only
          INVENTORY_DB_PASSWORD=ci_e2e_inventory_only
          PAYMENT_DB_PASSWORD=ci_e2e_payment_only
          JWT_SECRET=ci_e2e_jwt_secret_only
          EOF

      - name: Levantar el stack completo
        run: docker compose up -d --build

      - name: Esperar a que los servicios estén healthy
        run: |
          for i in $(seq 1 60); do
            COUNT=$(docker compose ps --status running | grep -c healthy || true)
            if [ "$COUNT" -ge 8 ]; then
              echo "healthy: $COUNT/8"
              break
            fi
            sleep 5
          done

      - name: Seed productos de prueba
        run: |
          docker compose exec -T product-service npm run seed || echo "Seed failed (non-critical)"

      - name: Setup Node para Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias e2e
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v
